[project]
name = "decisionos"
version = "0.1.0"
description = "DecisionOS: conversational retrieval over a markdown corpus"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decisionos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
